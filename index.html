hm.onclick=()=>{let me='';try{me=localStorage.getItem('myNick')||''}catch(e){}const i=nicks.findIndex(x=>x.toLowerCase()===me.toLowerCase());if(i>=0)flyTo(i);else{focus(0);theta=0.8;phi=1.0;dist=20}};
play.onclick=()=>{playing=!playing;play.textContent=playing?'❚❚':'▶'};
addb.onclick=addNick;
cmt.onclick=openComments;
nick.addEventListener('keydown',e=>{if(e.key==='Enter')addNick()});
lst.onclick=()=>{const q=nick.value.trim().replace(/^@/,'');if(q){const i=nicks.findIndex(n=>n.toLowerCase()===q.toLowerCase());if(i<0||deleted.has(nicks[i].toLowerCase())){say('Bunday nik topilmadi');return}panel.style.display='none';flyTo(i);nick.blur();showInfo(i);return}
  if(panel.style.display==='block'){panel.style.display='none';return}
  panel.replaceChildren();
  nicks.forEach((n,i)=>{if(deleted.has(n.toLowerCase()))return;const d=document.createElement('div');
    d.innerHTML='<b></b> <span></span>';d.firstChild.textContent=(i+1)+'. @'+n;
    d.lastChild.textContent=info(i).st+', '+info(i).num+'-uy';
    d.onclick=()=>{flyTo(i);panel.style.display='none'};panel.appendChild(d)});
  panel.style.display='block';
};

const SB='https://gunxxbbagzjdqtkdbgxu.supabase.co/rest/v1/houses',PK='sb_publishable_vn4qr5LbpUvjf4gAgw0Niw_3dSoD4YB';
const H={apikey:PK};
async function load(first){
  try{
    let r=await fetch(SB+'?select=nick,deleted,slot&order=created_at.asc&limit=5000',{headers:H});
    if(!r.ok)r=await fetch(SB+'?select=nick,deleted&order=created_at.asc&limit=5000',{headers:H});
    if(!r.ok)r=await fetch(SB+'?select=nick&order=created_at.asc&limit=5000',{headers:H});
    if(!r.ok)throw 0;
    const rows=await r.json(),list=[];let seq=0;
    rows.forEach(x=>{const n=String(x.nick||''),dl=x.deleted===true,sl=(typeof x.slot==='number')?x.slot:seq++;if(dl)deleted.add(n.toLowerCase());if(dl||KEY.test(n))list[sl]=n;else if(list[sl]===undefined)list[sl]=''});
    for(let q=0;q<list.length;q++)if(list[q]===undefined)list[q]='';
    remoteList=list;const merged=mergeList(list),grew=merged.length>shown.length;
    nicks=merged;render(nicks,!first);
    if(grew&&!first)focus(nicks.length-1);
  }catch(e){if(first)say('Server bilan aloqa yo’q: mahalla shu qurilmada saqlanadi')}
}
load(true);setInterval(()=>load(false),15000);

addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
const NC=26,cars=[];
for(let k=0;k<NC;k++)cars.push({s:[14,15,16,17,18,19,22,23,24,25][k%10],x:-110+rnd(k,11)*220,v:(2.5+rnd(k,12)*3)*(k%2?1:-1),c:k%5});
const carBody=new THREE.InstancedMesh(carG,new THREE.MeshLambertMaterial({color:0xffffff}),NC),carCab=new THREE.InstancedMesh(cabG,glassM,NC);
cars.forEach((c,k)=>carBody.setColorAt(k,new THREE.Color(carCols[c.c])));
carBody.frustumCulled=carCab.frustumCulled=false;scene.add(carBody,carCab);
const cm=new THREE.Matrix4(),cq=new THREE.Quaternion(),ce=new THREE.Euler(),cp=new THREE.Vector3(),csc=new THREE.Vector3(1,1,1);
function moveCars(dt){
  cars.forEach((c,k)=>{c.x+=c.v*dt;if(c.x>118)c.x=-118;if(c.x<-118)c.x=118;
    const dir=c.v>0?1:-1,z=cz(c.s,c.x)+(dir>0?-0.7:0.7);
    cq.setFromEuler(ce.set(0,dir>0?Math.PI/2:-Math.PI/2,0));
    cp.set(c.x,0.22,z);cm.compose(cp,cq,csc);carBody.setMatrixAt(k,cm);
    cp.set(c.x,0.46,z);cm.compose(cp,cq,csc);carCab.setMatrixAt(k,cm)});
  carBody.instanceMatrix.needsUpdate=carCab.instanceMatrix.needsUpdate=true;
}
try{buildCenter();buildSite()}catch(e){console.log(e)}
ctr.onclick=()=>{goal.set(0,0,ZC);dist=44;phi=1.0};
const rc=new THREE.Raycaster(),mv=new THREE.Vector2();let tap=null;
el.addEventListener('pointerdown',e=>{tap={x:e.clientX,y:e.clientY,t:performance.now(),n:pts.size}});
el.addEventListener('pointerup',e=>{if(tap&&tap.n===1&&performance.now()-tap.t<400&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<8)handleTap(e)});
function handleTap(e){const r=el.getBoundingClientRect();mv.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);rc.setFromCamera(mv,cam);
  const hit=rc.intersectObjects(houses,true).find(q=>!q.object.isSprite),hv=vacG&&rc.intersectObject(vacG)[0];
  if(hv&&hv.instanceId!==undefined&&(!hit||hv.distance<hit.distance)){infoPanel.style.display='none';selectSlot(vacIdx[hv.instanceId]);return}
  if(!hit){infoPanel.style.display='none';return}
  let o=hit.object;while(o&&houses.indexOf(o)<0)o=o.parent;const i=houses.indexOf(o);if(i>=0&&!houses[i].userData.deleted){flyTo(i);showInfo(i)}}
let lastT=performance.now();
let fr=0;
function updLabels(){houses.map(h=>[h.position.distanceTo(target),h]).sort((a,b)=>a[0]-b[0]).forEach(([d,h],k)=>{h.userData.lab.visible=k<25&&d<70;h.userData.plate.visible=d<24})}
(function loop(){
  requestAnimationFrame(loop);
  const nw=performance.now(),dt=Math.min(0.05,(nw-lastT)/1000);lastT=nw;try{moveCars(dt);animFount(nw/1000);if(heliRotor)heliRotor.rotation.y+=0.45}catch(e){}if(selMark)selMark.material.opacity=0.35+0.15*Math.sin(nw/250);
  houses.forEach(h=>{const u=h.userData;if(u.t<1){u.t=Math.min(1,u.t+0.04);h.scale.setScalar(HS*(u.t<1?Math.max(0.01,1-Math.pow(1-u.t,3)*Math.cos(u.t*9)):1))}});
  if(fly){if(pts.size)fly=null;else{theta+=(fly.theta-theta)*0.08;phi+=(fly.phi-phi)*0.08;dist+=(fly.dist-dist)*0.08;if(Math.abs(fly.theta-theta)<0.01&&Math.abs(fly.dist-dist)<0.08)fly=null}}
  if(playing&&!pts.size&&!fly)theta+=0.003;if(++fr%10===0){try{updLabels()}catch(e){}}target.lerp(goal,0.06);scene.fog.near=Math.max(90,dist*1.5);scene.fog.far=Math.max(900,dist*7);
  cam.position.set(target.x+dist*Math.sin(phi)*Math.sin(theta),dist*Math.cos(phi),target.z+dist*Math.sin(phi)*Math.cos(theta));
  cam.lookAt(target);ren.render(scene,cam);
})();
</script>
